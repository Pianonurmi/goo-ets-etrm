# The release version: X.Y.Z when tagged, X.Y.Z-SNAPSHOT in between (docs/operations/releases.md).
version=0.14.0-SNAPSHOT
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx2g
# CI (actions/setup-java) exposes the Java 25 toolchain through this variable; locally /usr/lib/jvm and the like are found.
org.gradle.java.installations.fromEnv=JAVA_HOME_25_X64
