# Image built by CI from ops/Dockerfile.
image:
  repository: ghcr.io/pianonurmi/goo-ets-etrm
  tag: ""          # defaults to the chart's appVersion
  pullPolicy: IfNotPresent
imagePullSecrets: []

# Two or more: ShedLock runs each scheduled job on one replica; the pod disruption budget keeps one serving.
replicaCount: 2

# Label in the UI header and in logs and traces (e.g. PROD, UAT).
environment: PROD

# Spring profiles: kubernetes (actuator on its own port, readiness with the database) and json (ECS logs).
profiles: kubernetes,json

database:
  # Secret with the JDBC URL and credentials. The default is the one CloudNativePG creates for the
  # application user of the cluster in ops/k8s/postgres-cluster.yaml (<cluster>-app with jdbc-uri, username, password).
  existingSecret: etrm-db-app
  urlKey: jdbc-uri
  usernameKey: username
  passwordKey: password
  # Connections per pod; keep poolMax times the maximum replicas below the database's max_connections.
  poolMax: 20
  # Separate owner and runtime roles (recommended for production): requests run as the role in this secret (same
  # keys), with table rights only, and the owner in existingSecret runs migrations and creates partitions. Then the
  # URL is given without credentials, e.g. jdbc:postgresql://etrm-db-rw:5432/etrm (CloudNativePG's jdbc-uri embeds the
  # owner's). ops/k8s/postgres-cluster.yaml creates the runtime role etrm_app with the secret etrm-db-runtime.
  runtimeSecret: etrm-db-runtime
  url: jdbc:postgresql://etrm-db-rw:5432/etrm

integrity:
  # Secret holding the key that signs the daily chain-head digest (docs/operations/database.md#tamper-evidence).
  # Empty: the digest is stored unsigned.
  signingKeySecret: ""
  signingKeyKey: signing-key

oidc:
  # Issuer the API validates tokens against, and the one the browser signs in with if it differs.
  issuer: https://login.example.com/realms/etrm
  browserIssuer: ""
  # Audience the API requires in access tokens (the identity provider adds it with an audience mapper).
  audience: etrm-api
  webClientId: etrm-web

kafka:
  # Selected domain events to Kafka (ADR 0029).
  enabled: false
  bootstrapServers: ""
  topicReplicas: 3

tracing:
  # OTLP endpoint of the OpenTelemetry collector, e.g. http://otel-collector.observability:4318/v1/traces
  otlpEndpoint: ""
  sampling: "0.1"

# Extra environment variables (list of name/value or valueFrom entries).
extraEnv: []

service:
  type: ClusterIP
  port: 80
  managementPort: 9090

ingress:
  enabled: true
  className: nginx
  host: etrm.example.com
  tlsSecret: etrm-tls
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 20m

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 2Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  minAvailable: 1

# Files the registry FILE channel writes for manual pickup. With more than one replica use a ReadWriteMany claim.
registryOutbox:
  persistence: false
  existingClaim: ""
  size: 1Gi
  storageClass: ""

networkPolicy:
  enabled: true
  # Namespaces allowed to reach the HTTP port (the ingress controller) and the management port (Prometheus).
  ingressNamespace: ingress-nginx
  monitoringNamespace: monitoring

serviceMonitor:
  enabled: false
  interval: 30s

# Alert rules for the Prometheus Operator (docs/operations/observability.md#alerts). Each alert links its runbook.
prometheusRule:
  enabled: false
  # Extra labels, e.g. the label your Prometheus selects rules by.
  labels: {}
  runbookBaseUrl: https://github.com/Pianonurmi/goo-ets-etrm/blob/main/docs/operations/runbooks
  # Backup and WAL archive alerts for the CloudNativePG cluster (ops/k8s/postgres-cluster.yaml).
  cnpg:
    enabled: false
    cluster: etrm-db

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
