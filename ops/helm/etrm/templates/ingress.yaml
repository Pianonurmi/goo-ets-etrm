{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "etrm.fullname" . }}
  labels:
    {{- include "etrm.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Only the HTTP port: the management port (actuator) is never routed outside the cluster.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "etrm.fullname" . }}
                port:
                  name: http
{{- end }}
