# Local development stack: PostgreSQL 17 (application, test and codegen databases) and Keycloak as OIDC provider.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: etrm
      POSTGRES_PASSWORD: etrm
      POSTGRES_DB: etrm
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/10-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U etrm"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: "8081"
      # One issuer for the browser and the API container: tokens always say localhost:8081, while the API fetches
      # keys over the compose network (backchannel). See docs/adr/0026.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak/etrm-realm.json:/opt/keycloak/data/import/etrm-realm.json:ro

  etrm:
    build:
      context: ..
      dockerfile: ops/Dockerfile
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ETRM_DB_URL: jdbc:postgresql://postgres:5432/etrm
      ETRM_DB_USER: etrm
      ETRM_DB_PASSWORD: etrm
      ETRM_OIDC_ISSUER: http://localhost:8081/realms/etrm
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://keycloak:8081/realms/etrm/protocol/openid-connect/certs
      # dev: persona headers instead of tokens; demo: seeds DEMO-FI and DEMO-SE on first start.
      SPRING_PROFILES_ACTIVE: dev,demo
      # The dev profile has no authentication and binds loopback; inside this local container it must listen on all
      # interfaces for the published port. Never set these two on a server others can reach.
      SERVER_ADDRESS: 0.0.0.0
      ETRM_DEV_ALLOW_REMOTE: "true"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres-data:
