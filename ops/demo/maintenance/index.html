<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="30" />
    <title>Provena demo is resetting</title>
    <style>
      :root { color-scheme: light dark; --ink: #0f172a; --muted: #475569; --canvas: #f8fafc; --surface: #ffffff; --line: #e2e8f0; --accent: #0e6e7e; }
      @media (prefers-color-scheme: dark) { :root { --ink: #e2e8f0; --muted: #94a3b8; --canvas: #0b1220; --surface: #111a2b; --line: #22304a; --accent: #3bb6c9; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--canvas); color: var(--ink);
        font: 16px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      main { max-width: 440px; margin: 16px; padding: 32px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
      h1 { font-size: 22px; margin: 16px 0 8px; letter-spacing: -0.01em; }
      p { color: var(--muted); margin: 0 0 12px; }
      .bar { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; }
      .bar span { display: block; height: 100%; width: 40%; background: var(--accent); animation: slide 1.6s ease-in-out infinite; }
      @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
      @media (prefers-reduced-motion: reduce) { .bar span { animation: none; width: 100%; } }
    </style>
  </head>
  <body>
    <main>
      <svg width="40" height="40" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="11" fill="#0E6E7E"/><rect x="11" y="13" width="26" height="4.5" rx="2.25" fill="#fff"/><rect x="11" y="21.75" width="18" height="4.5" rx="2.25" fill="#fff" opacity=".85"/><rect x="11" y="30.5" width="10" height="4.5" rx="2.25" fill="#fff" opacity=".7"/><circle cx="34" cy="32.75" r="4.5" fill="#fff"/></svg>
      <h1>The demo is being prepared</h1>
      <p>Provena resets its example portfolio every night and after an administrator's reset. The data is rebuilt through the application's own API; this takes a few minutes.</p>
      <p>This page reloads by itself.</p>
      <div class="bar" role="progressbar" aria-label="Preparing the demo"><span></span></div>
    </main>
  </body>
</html>
