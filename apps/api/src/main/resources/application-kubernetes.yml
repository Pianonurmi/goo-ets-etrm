# Inside Kubernetes: actuator on its own port, reachable by probes and Prometheus but not through the ingress.
management:
  server:
    port: ${ETRM_MANAGEMENT_PORT:9090}
  endpoint:
    health:
      group:
        # Not the database: when it is unreachable every pod would leave the service together and the ingress would
        # answer with its own errors. Pods stay ready and answer 503 problems; the alert EtrmDatabaseDown reports it.
        readiness:
          include: readinessState
server:
  # Behind the ingress: X-Forwarded-* headers set the scheme and host the browser used.
  forward-headers-strategy: framework
