# Development: persona headers instead of sign-in (ADR 0026). No authentication, so the server listens on
# loopback only; ProfileGuard refuses anything else unless etrm.dev.allow-remote is set (local container only).
server:
  address: 127.0.0.1
spring:
  jackson:
    serialization:
      indent-output: true
logging:
  level:
    com.pianonurmi.etrm: DEBUG
    org.jooq.tools.LoggerListener: DEBUG
etrm:
  ui:
    auth-mode: DEV_HEADERS
    environment: DEV
