spring:
  application:
    name: goo-ets-etrm
  main:
    banner-mode: off
  lifecycle:
    # Graceful shutdown: requests in flight and scheduled jobs get this long before the context closes.
    timeout-per-shutdown-phase: 30s
  threads:
    virtual:
      # Requests, scheduled jobs and async work run on virtual threads. This needs Java 24 or later (JEP 491): on Java 21 a
      # virtual thread blocking inside synchronized pinned its carrier, and concurrent first serialisations
      # (Jackson's serializer cache with kotlin-reflect's locks) hung the server. ConcurrencyIT covers that case.
      enabled: true
  datasource:
    url: ${ETRM_DB_URL:jdbc:postgresql://localhost:5432/etrm}
    username: ${ETRM_DB_USER:etrm}
    password: ${ETRM_DB_PASSWORD:etrm}
    hikari:
      maximum-pool-size: 20
      pool-name: etrm
  flyway:
    enabled: false   # migrations run per module schema, see ModularMigrations
  jooq:
    sql-dialect: postgres
  web:
    resources:
      # The UI bundle is served by SpaConfiguration (index.html fallback and cache headers).
      add-mappings: false
  modulith:
    events:
      jdbc:
        schema: etrm_platform
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true
      completion-mode: update
      externalization:
        # Selected domain events go to Kafka (see ExternalEvents). Off unless a broker is configured.
        enabled: ${ETRM_KAFKA_ENABLED:false}
  kafka:
    bootstrap-servers: ${ETRM_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Spring Modulith converts events to JSON bytes with the application's mapper.
      value-serializer: org.apache.kafka.common.serialization.ByteArraySerializer
      acks: all
      properties:
        enable.idempotence: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ETRM_OIDC_ISSUER:http://localhost:8081/realms/etrm}
          # Tokens must be issued for this API (the `aud` claim), not merely by the same identity provider.
          audiences: ${ETRM_OIDC_AUDIENCE:etrm-api}

etrm:
  migrations:
    enabled: true
    # The schema owner (migrations, partitions); requests then run as ETRM_DB_USER with table rights only.
    user: ${ETRM_DB_MIGRATION_USER:}
    password: ${ETRM_DB_MIGRATION_PASSWORD:}
  integrity:
    # Signs the daily chain-head digest (HMAC-SHA256); without it the digest is stored unsigned.
    signing-key: ${ETRM_INTEGRITY_SIGNING_KEY:}
  ui:
    # Browser sign-in (ADR 0026): Authorization Code with PKCE against the public client etrm-web.
    auth-mode: OIDC
    environment: ${ETRM_ENVIRONMENT:}
    oidc:
      authority: ${ETRM_OIDC_BROWSER_ISSUER:${ETRM_OIDC_ISSUER:http://localhost:8081/realms/etrm}}
      client-id: ${ETRM_OIDC_WEB_CLIENT:etrm-web}
      scope: openid profile
  security:
    roles-claim: roles
    legal-entities-claim: legal_entities
  marketdata:
    max-move-pct: 25
    fx-max-staleness-days: 10
    ecb:
      # Pulls the ECB euro reference rates on working days; needs outbound access to www.ecb.europa.eu.
      enabled: ${ETRM_ECB_ENABLED:false}
  ledger:
    # Conditions for a hard close (ADR 0024): ALL_EXPORTED, LAST_EXPORT_ACKNOWLEDGED, PERIOD_END_RUN.
    hard-close-gates: ALL_EXPORTED,LAST_EXPORT_ACKNOWLEDGED,PERIOD_END_RUN
  etscompliance:
    # Daily review of ETS deadlines (Europe/Berlin): reminders 30, 14 and 7 days before, and when overdue.
    deadline-cron: "0 15 6 * * *"

server:
  port: 8080
  error:
    include-message: never
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/html,text/css,text/csv,application/javascript,text/javascript,image/svg+xml
    min-response-size: 2KB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith,sbom
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  tracing:
    sampling:
      probability: ${ETRM_TRACE_SAMPLING:0.1}
  # Traces go to an OTLP collector only when one is configured:
  # MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT=http://collector:4318/v1/traces
  opentelemetry:
    resource-attributes:
      service.name: goo-ets-etrm
      deployment.environment: ${ETRM_ENVIRONMENT:local}
  metrics:
    tags:
      application: goo-ets-etrm
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,250ms,500ms,1s,2s
  observations:
    key-values:
      application: goo-ets-etrm

springdoc:
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.pianonurmi.etrm: INFO
    org.jooq.Constants: WARN
