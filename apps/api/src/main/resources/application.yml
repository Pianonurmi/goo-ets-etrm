spring:
  application:
    name: goo-ets-etrm
  main:
    banner-mode: off
  threads:
    virtual:
      # Off on Java 21: a virtual thread that blocks in a synchronized block pins its carrier. Concurrent first
      # serialisations (Jackson's serializer cache with kotlin-reflect's locks) pinned every carrier and hung the
      # server. Turn back on with Java 24+ (JEP 491, no pinning in synchronized).
      enabled: false
  datasource:
    url: ${ETRM_DB_URL:jdbc:postgresql://localhost:5432/etrm}
    username: ${ETRM_DB_USER:etrm}
    password: ${ETRM_DB_PASSWORD:etrm}
    hikari:
      maximum-pool-size: 20
      pool-name: etrm
  flyway:
    enabled: false   # migrations run per module schema, see ModularMigrations
  jooq:
    sql-dialect: postgres
  web:
    resources:
      # The UI bundle is served by SpaConfiguration (index.html fallback and cache headers).
      add-mappings: false
  modulith:
    events:
      jdbc:
        schema: etrm_platform
        schema-initialization:
          enabled: false
      republish-outstanding-events-on-restart: true
      completion-mode: update
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ETRM_OIDC_ISSUER:http://localhost:8081/realms/etrm}

etrm:
  migrations:
    enabled: true
  ui:
    # Browser sign-in (ADR 0026): Authorization Code with PKCE against the public client etrm-web.
    auth-mode: OIDC
    environment: ${ETRM_ENVIRONMENT:}
    oidc:
      authority: ${ETRM_OIDC_BROWSER_ISSUER:${ETRM_OIDC_ISSUER:http://localhost:8081/realms/etrm}}
      client-id: ${ETRM_OIDC_WEB_CLIENT:etrm-web}
      scope: openid profile
  security:
    roles-claim: roles
    legal-entities-claim: legal_entities
  marketdata:
    max-move-pct: 25
    fx-max-staleness-days: 10
    ecb:
      # Pulls the ECB euro reference rates on working days; needs outbound access to www.ecb.europa.eu.
      enabled: ${ETRM_ECB_ENABLED:false}
  ledger:
    # Conditions for a hard close (ADR 0024): ALL_EXPORTED, LAST_EXPORT_ACKNOWLEDGED, PERIOD_END_RUN.
    hard-close-gates: ALL_EXPORTED,LAST_EXPORT_ACKNOWLEDGED,PERIOD_END_RUN
  etscompliance:
    # Daily review of ETS deadlines (Europe/Berlin): reminders 30, 14 and 7 days before, and when overdue.
    deadline-cron: "0 15 6 * * *"

server:
  port: 8080
  error:
    include-message: never
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/html,text/css,text/csv,application/javascript,text/javascript,image/svg+xml
    min-response-size: 2KB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  tracing:
    sampling:
      probability: 0.1

springdoc:
  default-produces-media-type: application/json
  default-consumes-media-type: application/json
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.pianonurmi.etrm: INFO
    org.jooq.Constants: WARN
