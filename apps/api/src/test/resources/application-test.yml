spring:
  datasource:
    # Every full-context test class caches its own context and pool; keep them small so they fit max_connections.
    hikari:
      maximum-pool-size: 4
      minimum-idle: 0
      idle-timeout: 10000
  task:
    scheduling:
      pool:
        size: 1
etrm:
  ui:
    auth-mode: DEV_HEADERS
    environment: TEST
  trade:
    approval-threshold: 0
  registry:
    outbox-dir: build/test-registry-outbox
logging:
  level:
    com.pianonurmi.etrm: INFO
    org.springframework.modulith: WARN
