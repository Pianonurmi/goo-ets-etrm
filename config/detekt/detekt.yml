build:
  maxIssues: 0

complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 12
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Bean', 'Component', 'Service', 'RestController', 'Configuration']
  TooManyFunctions:
    thresholdInFiles: 25
    thresholdInClasses: 25
    thresholdInInterfaces: 25
    thresholdInObjects: 25
    ignorePrivate: true
  LongMethod:
    threshold: 80
  CyclomaticComplexMethod:
    threshold: 20
  NestedBlockDepth:
    threshold: 5
  LargeClass:
    threshold: 800

style:
  MaxLineLength:
    maxLineLength: 140
  ReturnCount:
    max: 4
  MagicNumber:
    active: false
  ThrowsCount:
    max: 4
  UnusedPrivateMember:
    active: true
  WildcardImport:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated: ['Test', 'ParameterizedTest', 'Bean']
  MatchingDeclarationName:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

potential-bugs:
  UnsafeCallOnNullableType:
    active: false
