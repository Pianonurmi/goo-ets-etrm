build:
  maxIssues: 0

complexity:
  LongParameterList:
    functionThreshold: 8
    constructorThreshold: 10
    ignoreDefaultParameters: true
    ignoreAnnotated: ['Bean', 'Component', 'RestController', 'Configuration']
  TooManyFunctions:
    thresholdInFiles: 25
    thresholdInClasses: 25
    thresholdInInterfaces: 25
    thresholdInObjects: 25
    ignorePrivate: true
  LongMethod:
    threshold: 80
  CyclomaticComplexMethod:
    threshold: 25
    ignoreSimpleWhenEntries: true
    ignoreSingleWhenExpression: true
  NestedBlockDepth:
    threshold: 5
  LargeClass:
    threshold: 500
    # An integration test is one scenario per method over a shared fixture; it is not split for size.
    excludes: ['**/src/test/**', '**/src/testFixtures/**']

style:
  LoopWithTooManyJumpStatements:
    active: false
  MaxLineLength:
    maxLineLength: 160
  ReturnCount:
    max: 4
  MagicNumber:
    active: false
  ThrowsCount:
    max: 12
    excludeGuardClauses: true
  UnusedPrivateMember:
    active: true
  WildcardImport:
    active: false

naming:
  FunctionNaming:
    ignoreAnnotated: ['Test', 'ParameterizedTest', 'Bean']
  MatchingDeclarationName:
    active: false

exceptions:
  TooGenericExceptionCaught:
    active: false
  SwallowedException:
    active: false

potential-bugs:
  # Needs type resolution, so it runs in `detektMain` with config/detekt/type-resolution.yml.
  UnsafeCallOnNullableType:
    active: false

performance:
  SpreadOperator:
    active: false
