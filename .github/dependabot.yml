version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      spring:
        patterns: ["org.springframework*", "io.spring*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # One PR for all action bumps; they are tested together by the same workflows.
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*", "react-router*"]
      mantine:
        patterns: ["@mantine/*"]
      tooling:
        dependency-type: development
    ignore:
      # Stay on the Node 22 line: engines and CI are Node 22, so @types/node majors above 22 would
      # type APIs the runtime does not have. Minor and patch updates still come.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # typescript-eslint 8.x supports TypeScript <6.1.0 and openapi-typescript 7.x only ^5.x, so
      # TypeScript 6 and 7 break lint and gen:api. Lift this when both declare support.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: "/ops"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
  # The demo stack pins its images by digest too (ops/demo/docker-compose.yml).
  - package-ecosystem: docker-compose
    directory: "/ops/demo"
    schedule:
      interval: weekly
