version: 2
updates:
  - package-ecosystem: gradle
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      spring:
        patterns: ["org.springframework*", "io.spring*"]
      kotlin:
        patterns: ["org.jetbrains.kotlin*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # One PR for all action bumps; they are tested together by the same workflows.
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: "/apps/web"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      react:
        patterns: ["react", "react-dom", "@types/react*", "react-router*"]
      mantine:
        patterns: ["@mantine/*"]
      tooling:
        dependency-type: development
  - package-ecosystem: docker
    directory: "/ops"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
