name: Property tests (random seeds)

# Pull requests run the property tests with fixed seeds, so a build is reproducible. This run draws new seeds every
# night to explore further (ADR 0049); a failure prints its seed, and `-Detrm.proptest.seed=<n>` replays it.
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: property-nightly
  cancel-in-progress: false

jobs:
  properties:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: etrm
          POSTGRES_PASSWORD: etrm
          POSTGRES_DB: etrm_codegen
        # A free host port: the runner may host other jobs and databases.
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U etrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ETRM_DB_USER: etrm
      ETRM_DB_PASSWORD: etrm
    steps:
      - name: Database on the service's port
        run: |
          port=${{ job.services.postgres.ports['5432'] }}
          {
            echo "PGPORT=$port"
            echo "ETRM_CODEGEN_DB_URL=jdbc:postgresql://localhost:$port/etrm_codegen"
            echo "ETRM_TEST_DB_URL=jdbc:postgresql://localhost:$port/etrm_test"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Create the test database
        run: PGPASSWORD=etrm psql -h localhost -U etrm -d etrm_codegen -c "CREATE DATABASE etrm_test;"
      # Every test that uses PropertySeeds; the seeds drawn are in the log ("Property test seed").
      - name: Property tests with random seeds
        run: >-
          ./gradlew --no-daemon -Petrm.skipWeb -Detrm.proptest.seed=random
          :modules:allocation:test --tests '*AllocationEngineTest' --tests '*FlowCoreTest' --tests '*ShadowPriceTest' --tests '*ExactSolverTest'
          :modules:ledger:test --tests '*BalancePropertyTest' --tests '*GlInterfaceIT'
          :modules:product:test --tests '*CriteriaImplicationTest' --tests '*CriteriaSqlEquivalenceIT'
          :modules:valuation:test --tests '*PnlExplainTest'
      - name: Seeds drawn
        if: always()
        run: grep -rho --include='*.xml' 'Property test seed [-0-9]* ([^)]*)' modules/*/build/test-results | sort -u || true
