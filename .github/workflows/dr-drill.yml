name: DR drill

# Backup, restore into an empty database, start the jar on the copy and verify it (docs/operations/disaster-recovery.md).
on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 1 * *"

jobs:
  drill:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: etrm
          POSTGRES_PASSWORD: etrm
          POSTGRES_DB: etrm_codegen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U etrm -d etrm_codegen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ETRM_CODEGEN_DB_URL: jdbc:postgresql://localhost:5432/etrm_codegen
      ETRM_DB_USER: etrm
      ETRM_DB_PASSWORD: etrm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: PostgreSQL 17 client
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"
      - name: Boot jar
        run: ./gradlew :apps:api:bootJar
      - name: Seed a source database with the demo data
        run: |
          PGPASSWORD=etrm psql -h localhost -U etrm -d etrm_codegen -c "CREATE DATABASE etrm_source"
          ETRM_DB_URL=jdbc:postgresql://localhost:5432/etrm_source nohup "$JAVA_HOME_25_X64/bin/java" -jar apps/api/build/libs/api.jar \
            --spring.profiles.active=dev,demo --logging.level.com.pianonurmi.etrm=INFO > seed.log 2>&1 &
          echo $! > seed.pid
          for i in $(seq 1 120); do curl -fs http://localhost:8080/actuator/health/readiness && break; sleep 2; done
          curl -fs http://localhost:8080/actuator/health/readiness
          kill "$(cat seed.pid)"
      - name: Drill
        env:
          SOURCE_DB_URL: postgresql://etrm:etrm@localhost:5432/etrm_source
          TARGET_DB_URL: postgresql://etrm:etrm@localhost:5432/etrm_dr
          JAVA: ${{ env.JAVA_HOME_25_X64 }}/bin/java
        run: |
          ops/dr/drill.sh
          cat build/dr/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dr-drill
          path: |
            build/dr/report.md
            build/dr/drill.log
            build/dr/app.log
            build/dr/counts.diff
            seed.log
          retention-days: 90
