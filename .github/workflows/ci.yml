name: CI

on:
  push:
    # Other branches are built by their pull request; building them on push as well ran every check twice.
    branches: ["main", "release/**"]
    # A release: vX.Y.Z publishes the image under its version and creates the GitHub release (docs/operations/releases.md).
    tags: ["v*"]
  pull_request:
  # The Dependabot lock refresh (dependabot-refresh.yml) starts CI on the commit it pushed.
  workflow_dispatch:
  # The Release workflow (release.yml) runs this one for the commit it has tagged.
  workflow_call:
    inputs:
      release_version:
        description: The version being released (X.Y.Z)
        type: string
        required: true
      ref:
        description: The commit to build
        type: string
        required: true

concurrency:
  group: ci-${{ github.ref }}${{ inputs.release_version && format('-release-{0}', inputs.release_version) || '' }}
  cancel-in-progress: true

# The token reads the repository only; jobs that publish or release widen it themselves.
permissions:
  contents: read

jobs:
  chart:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.16.2
      # Into the job's own directory (no sudo on a self-hosted runner), checked against the release's checksum.
      - name: Install kubeconform
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSLf -o "$RUNNER_TEMP/kubeconform.tar.gz" https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz
          echo "c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP/bin" kubeconform
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Lint the Helm chart
        run: helm lint --strict ops/helm/etrm
      # Default values and every optional part switched on, against the Kubernetes schemas; CRDs (ServiceMonitor,
      # CloudNativePG) against the community catalogue.
      - name: Validate rendered manifests
        run: |
          helm template etrm ops/helm/etrm > default.yaml
          helm template etrm ops/helm/etrm --set autoscaling.enabled=false --set registryOutbox.persistence=true \
            --set kafka.enabled=true --set kafka.bootstrapServers=kafka:9092 --set serviceMonitor.enabled=true \
            --set prometheusRule.enabled=true --set prometheusRule.cnpg.enabled=true \
            --set tracing.otlpEndpoint=http://otel:4318/v1/traces > full.yaml
          kubeconform -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            default.yaml full.yaml ops/k8s/postgres-cluster.yaml
      # The public demo stack (docs/deploy/vps.md): both compose variants resolve, the tunnel variant publishes no
      # port, and both Caddyfiles parse.
      - name: Validate the demo stack
        working-directory: ops/demo
        env:
          POSTGRES_PASSWORD: ci
          CLOUDFLARE_TUNNEL_TOKEN: ci
        run: |
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.tunnel.yml config > tunnel.yaml
          if grep -q 'published:' tunnel.yaml; then echo "The tunnel variant publishes a port" >&2; exit 1; fi
          for f in Caddyfile Caddyfile.tunnel; do
            docker run --rm -v "$PWD:/etc/caddy:ro" caddy:2.10-alpine caddy validate --adapter caddyfile --config "/etc/caddy/$f"
          done

  build:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 45
    permissions:
      contents: read
      # Publishes the image to GHCR from main and from release tags (docs/operations/releases.md).
      packages: write
    outputs:
      release-version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: etrm
          POSTGRES_PASSWORD: etrm
          POSTGRES_DB: etrm_codegen
        # A free host port: the runner may host other jobs and databases.
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U etrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ETRM_DB_USER: etrm
      ETRM_DB_PASSWORD: etrm
    steps:
      - name: Database on the service's port
        run: |
          port=${{ job.services.postgres.ports['5432'] }}
          {
            echo "DB_PORT=$port"
            echo "PGPORT=$port"
            echo "ETRM_CODEGEN_DB_URL=jdbc:postgresql://localhost:$port/etrm_codegen"
            echo "ETRM_TEST_DB_URL=jdbc:postgresql://localhost:$port/etrm_test"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      # A release is a vX.Y.Z tag push or a call from the Release workflow; its version must match the files.
      - name: Release context
        id: release
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          version="$RELEASE_VERSION"
          if [[ -z "$version" && "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ -n "$version" ]]; then ops/release/check-version.sh "$version"; fi
      # The wrapper refuses a Gradle distribution whose checksum differs from distributionSha256Sum; this checks the
      # pin against the checksum Gradle publishes (docs/operations/supply-chain.md#pinning).
      - name: Gradle distribution checksum
        run: |
          url=$(sed -n 's/^distributionUrl=//p' gradle/wrapper/gradle-wrapper.properties | sed 's/\\:/:/g')
          published=$(curl -fsSL "$url.sha256")
          pinned=$(sed -n 's/^distributionSha256Sum=//p' gradle/wrapper/gradle-wrapper.properties)
          if [[ -z "$pinned" ]]; then
            echo "::error::distributionSha256Sum is not set; Gradle publishes $published for $url"
            exit 1
          elif [[ "$pinned" != "$published" ]]; then
            echo "::error::distributionSha256Sum $pinned differs from the published $published for $url"
            exit 1
          fi
      # detekt baselines hold findings that predate a rule and only shrink (config/detekt/type-resolution.yml).
      - name: detekt baselines do not grow
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          ops/ci/detekt-baseline-check.sh FETCH_HEAD
      # The application runs on Java 25 (toolchain); Gradle itself runs on 21, the last one listed.
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Create test databases
        run: |
          PGPASSWORD=etrm psql -h localhost -U etrm -d etrm_codegen -c "CREATE DATABASE etrm_test;"
          PGPASSWORD=etrm psql -h localhost -U etrm -d etrm_codegen -c "CREATE DATABASE etrm_e2e;"
          PGPASSWORD=etrm psql -h localhost -U etrm -d etrm_codegen -c "CREATE DATABASE etrm_showcase_e2e;"
      - name: Build, lint and test
        run: ./gradlew build koverXmlReport --no-daemon --stacktrace
      - name: Software bills of materials (backend runtime classpath, web bundle)
        run: |
          ./gradlew :apps:api:cyclonedxDirectBom --no-daemon
          (cd apps/web && npm run sbom)
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            apps/api/build/spring-modulith-docs/**
          retention-days: 7
      # api.jar for production; api-showcase.jar adds the demo seeder for the public demo and the end-to-end tests.
      - name: Boot jars
        run: ./gradlew :apps:api:bootJar :apps:api:showcaseJar --no-daemon
      # The system libraries come with the self-hosted runner (ops/runner/provision.sh); hosted runners install them.
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
      - name: End-to-end tests (Playwright against the jar)
        working-directory: apps/web
        env:
          CI: "true"
          E2E_DB_URL: jdbc:postgresql://localhost:${{ env.DB_PORT }}/etrm_e2e
          E2E_SHOWCASE_DB_URL: jdbc:postgresql://localhost:${{ env.DB_PORT }}/etrm_showcase_e2e
          ETRM_JAVA: ${{ env.JAVA_HOME_25_X64 }}/bin/java
        run: npm run e2e
      # A rolling upgrade runs the previous release on this build's migrations (ADR 0048).
      - name: Previous release on the migrated schema
        env:
          GH_TOKEN: ${{ github.token }}
          JAVA: ${{ env.JAVA_HOME_25_X64 }}/bin/java
        run: |
          PGPASSWORD=etrm psql -h localhost -U etrm -d etrm_codegen -c "CREATE DATABASE etrm_compat;"
          PGPASSWORD=etrm psql -h localhost -U etrm -d etrm_codegen -c "CREATE DATABASE etrm_compat_base;"
          ops/release/compat-check.sh apps/api/build/libs/api-showcase.jar "jdbc:postgresql://localhost:$DB_PORT/etrm_compat" \
            "jdbc:postgresql://localhost:$DB_PORT/etrm_compat_base"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright
          path: |
            apps/web/build/playwright-report/**
            apps/web/build/test-results/**
          retention-days: 7
      - name: Build container image
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          labels=(--label org.opencontainers.image.version="$version"
            --label org.opencontainers.image.revision="${{ steps.release.outputs.sha }}"
            --label org.opencontainers.image.created="$(date -u +%Y-%m-%dT%H:%M:%SZ)")
          docker build -t "goo-ets-etrm:${{ github.sha }}" -f ops/Dockerfile "${labels[@]}" .
          # The showcase image: the same image with the demo seeder's jar (ops/demo); the scans below cover its layers.
          docker build -t "goo-ets-etrm-showcase:${{ github.sha }}" -f ops/Dockerfile \
            --build-arg JAR=apps/api/build/libs/api-showcase.jar "${labels[@]}" .
      - name: Image vulnerabilities (report critical and high)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: goo-ets-etrm:${{ github.sha }}
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
      - name: Image vulnerabilities (fail on critical or high with a fix available)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: goo-ets-etrm:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
          skip-setup-trivy: true
      - name: Publish the image (main and release tags)
        if: steps.release.outputs.version != '' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          # main: main and the commit; vX.Y.Z: X.Y.Z, X.Y, latest and the commit (ops/release/image-tags.sh).
          ref="$GITHUB_REF"
          [[ -n "${{ steps.release.outputs.version }}" ]] && ref="refs/tags/v${{ steps.release.outputs.version }}"
          for tag in $(ops/release/image-tags.sh "$ref" "${{ steps.release.outputs.sha }}"); do
            docker tag "goo-ets-etrm:${{ github.sha }}" "$image:$tag"
            docker push "$image:$tag"
            docker tag "goo-ets-etrm-showcase:${{ github.sha }}" "$image-showcase:$tag"
            docker push "$image-showcase:$tag"
          done
      # Built hidden and kept out of the jar (apps/web/vite.config.ts): read a client error report's stack against them.
      - name: Upload the web source maps
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-sourcemaps
          path: apps/web/build/sourcemaps/
          if-no-files-found: error
          retention-days: 90
      - name: Upload the jar (releases only)
        if: steps.release.outputs.version != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jar
          path: apps/api/build/libs/api.jar
          retention-days: 7
      - name: Image SBOM
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: goo-ets-etrm:${{ github.sha }}
          format: cyclonedx
          output: etrm-image.cdx.json
          exit-code: "0"
          skip-setup-trivy: true
      - name: Upload SBOMs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: |
            apps/api/build/reports/sbom/etrm-backend.cdx.json
            apps/web/build/sbom/etrm-web.cdx.json
            etrm-image.cdx.json
          retention-days: 90

  # A release tag: the GitHub release with the changelog section, the jar and the SBOMs, once the build is green.
  release:
    needs: [chart, build]
    if: needs.build.outputs.release-version != ''
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: v${{ needs.build.outputs.release-version }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: dist/sbom
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: jar
          path: dist/jar
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.release-version }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          version="$VERSION"
          tag="v$version"
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          {
            ops/release/release-notes.sh "$version"
            echo
            echo "### Container image"
            echo
            echo "\`\`\`"
            echo "docker pull $image:$version"
            echo "\`\`\`"
            echo
            if [[ "$version" == *-* ]]; then
              echo "A pre-release: also tagged with the commit \`$SHA\`; no floating tag moves."
            else
              echo "Also tagged \`${version%.*}\` (follows the patch releases of ${version%.*}), \`latest\` and the commit \`$SHA\`."
            fi
          } > notes.md
          mv dist/jar/api.jar "dist/provena-$version.jar"
          mapfile -t sboms < <(find dist/sbom -name '*.cdx.json')
          flags=()
          [[ "$version" == *-* ]] && flags+=(--prerelease)
          assets=("dist/provena-$version.jar" "${sboms[@]}")
          if gh release view "$tag" >/dev/null 2>&1; then
            # Made by hand in the GitHub UI first: keep it, fill in the notes and the assets.
            gh release edit "$tag" --title "Provena $version" --notes-file notes.md "${flags[@]}"
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" --verify-tag --title "Provena $version" --notes-file notes.md "${flags[@]}" "${assets[@]}"
          fi
