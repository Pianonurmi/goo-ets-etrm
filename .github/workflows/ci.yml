name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2
      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz kubeconform
          sudo mv kubeconform /usr/local/bin/
      - name: Lint the Helm chart
        run: helm lint --strict ops/helm/etrm
      # Default values and every optional part switched on, against the Kubernetes schemas; CRDs (ServiceMonitor,
      # CloudNativePG) against the community catalogue.
      - name: Validate rendered manifests
        run: |
          helm template etrm ops/helm/etrm > default.yaml
          helm template etrm ops/helm/etrm --set autoscaling.enabled=false --set registryOutbox.persistence=true \
            --set kafka.enabled=true --set kafka.bootstrapServers=kafka:9092 --set serviceMonitor.enabled=true \
            --set tracing.otlpEndpoint=http://otel:4318/v1/traces > full.yaml
          kubeconform -strict -summary -kubernetes-version 1.31.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            default.yaml full.yaml ops/k8s/postgres-cluster.yaml

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # Publishes the image to GHCR on main (docs/deploy/vps.md).
      packages: write
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: etrm
          POSTGRES_PASSWORD: etrm
          POSTGRES_DB: etrm_codegen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U etrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ETRM_CODEGEN_DB_URL: jdbc:postgresql://localhost:5432/etrm_codegen
      ETRM_TEST_DB_URL: jdbc:postgresql://localhost:5432/etrm_test
      ETRM_DB_USER: etrm
      ETRM_DB_PASSWORD: etrm
    steps:
      - uses: actions/checkout@v4
      # The application runs on Java 25 (toolchain); Gradle itself runs on 21, the last one listed.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Create test databases
        run: |
          PGPASSWORD=etrm psql -h localhost -U etrm -d etrm_codegen -c "CREATE DATABASE etrm_test;"
          PGPASSWORD=etrm psql -h localhost -U etrm -d etrm_codegen -c "CREATE DATABASE etrm_e2e;"
          PGPASSWORD=etrm psql -h localhost -U etrm -d etrm_codegen -c "CREATE DATABASE etrm_showcase_e2e;"
      - name: Build, lint and test
        run: ./gradlew build koverXmlReport --no-daemon --stacktrace
      - name: Software bills of materials (backend runtime classpath, web bundle)
        run: |
          ./gradlew :apps:api:cyclonedxDirectBom --no-daemon
          (cd apps/web && npm run sbom)
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            apps/api/build/spring-modulith-docs/**
          retention-days: 14
      - name: Boot jar
        run: ./gradlew :apps:api:bootJar --no-daemon
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright against the jar)
        working-directory: apps/web
        env:
          CI: "true"
          E2E_DB_URL: jdbc:postgresql://localhost:5432/etrm_e2e
          E2E_SHOWCASE_DB_URL: jdbc:postgresql://localhost:5432/etrm_showcase_e2e
          ETRM_JAVA: ${{ env.JAVA_HOME_25_X64 }}/bin/java
        run: npm run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            apps/web/build/playwright-report/**
            apps/web/build/test-results/**
          retention-days: 14
      - name: Build container image
        run: docker build -t goo-ets-etrm:${{ github.sha }} -f ops/Dockerfile .
      - name: Image vulnerabilities (report critical and high)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: goo-ets-etrm:${{ github.sha }}
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
          trivyignores: .trivyignore
      - name: Image vulnerabilities (fail on critical with a fix available)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: goo-ets-etrm:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL
          trivyignores: .trivyignore
          skip-setup-trivy: true
      - name: Publish the image (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "goo-ets-etrm:${{ github.sha }}" "$image:${{ github.sha }}"
          docker tag "goo-ets-etrm:${{ github.sha }}" "$image:main"
          docker push "$image:${{ github.sha }}"
          docker push "$image:main"
      - name: Image SBOM
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: goo-ets-etrm:${{ github.sha }}
          format: cyclonedx
          output: etrm-image.cdx.json
          exit-code: "0"
          skip-setup-trivy: true
      - name: Upload SBOMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: |
            apps/api/build/reports/sbom/etrm-backend.cdx.json
            apps/web/build/sbom/etrm-web.cdx.json
            etrm-image.cdx.json
          retention-days: 90
