name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: etrm
          POSTGRES_PASSWORD: etrm
          POSTGRES_DB: etrm_codegen
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U etrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ETRM_CODEGEN_DB_URL: jdbc:postgresql://localhost:5432/etrm_codegen
      ETRM_TEST_DB_URL: jdbc:postgresql://localhost:5432/etrm_test
      ETRM_DB_USER: etrm
      ETRM_DB_PASSWORD: etrm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Create test databases
        run: |
          PGPASSWORD=etrm psql -h localhost -U etrm -d etrm_codegen -c "CREATE DATABASE etrm_test;"
          PGPASSWORD=etrm psql -h localhost -U etrm -d etrm_codegen -c "CREATE DATABASE etrm_e2e;"
      - name: Build, lint and test
        run: ./gradlew build koverXmlReport --no-daemon --stacktrace
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            apps/api/build/spring-modulith-docs/**
          retention-days: 14
      - name: Boot jar
        run: ./gradlew :apps:api:bootJar --no-daemon
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests (Playwright against the jar)
        working-directory: apps/web
        env:
          CI: "true"
          E2E_DB_URL: jdbc:postgresql://localhost:5432/etrm_e2e
        run: npm run e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            apps/web/build/playwright-report/**
            apps/web/build/test-results/**
          retention-days: 14
      - name: Build container image
        run: docker build -t goo-ets-etrm:${{ github.sha }} -f ops/Dockerfile .
      - name: SBOM and vulnerability scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: goo-ets-etrm:${{ github.sha }}
          format: table
          exit-code: "0"
          severity: CRITICAL,HIGH
