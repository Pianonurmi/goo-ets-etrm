name: Dependabot lock refresh

# Dependabot bumps versions but does not regenerate the Gradle lock files and gradle/verification-metadata.xml, and
# its npm lock files leave out optional peers (msw for Vitest), so `npm ci` refuses them. This workflow regenerates
# them on Dependabot's branch, commits the result and starts CI on it (docs/operations/supply-chain.md#updates).
#
# Two jobs, so the updated dependency's build code never runs with a write token: `regenerate` builds with a
# read-only token and uploads the changed lock files; `commit` takes only those files, pushes them and starts CI
# (a push with GITHUB_TOKEN starts no workflow by itself).
on:
  pull_request:
    branches: ["main", "release/**"]

permissions:
  contents: read

concurrency:
  group: dependabot-refresh-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  regenerate:
    if: >-
      github.actor == 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
      && (startsWith(github.head_ref, 'dependabot/gradle/') || startsWith(github.head_ref, 'dependabot/npm_and_yarn/'))
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: startsWith(github.head_ref, 'dependabot/gradle/')
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: startsWith(github.head_ref, 'dependabot/gradle/')
        with:
          cache-read-only: true
      # The components are written afresh, so versions the update replaced leave the file; the configuration
      # (trusted IDE artifacts) stays.
      - name: Gradle lock files and verification metadata
        if: startsWith(github.head_ref, 'dependabot/gradle/')
        run: |
          perl -0pi -e 's|<components>.*</components>|<components>\n   </components>|s' gradle/verification-metadata.xml
          ./gradlew --no-daemon -Petrm.skipWeb --write-verification-metadata sha256 --write-locks \
            resolveAndLockAll :build-logic:resolveAndLockAll
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: startsWith(github.head_ref, 'dependabot/npm_and_yarn/')
        with:
          node-version: "22"
      - name: npm lock file
        if: startsWith(github.head_ref, 'dependabot/npm_and_yarn/')
        working-directory: apps/web
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Collect the changed lock files
        run: |
          mkdir -p "$RUNNER_TEMP/locks"
          git status --porcelain
          git diff --name-only > "$RUNNER_TEMP/locks/changed.txt"
          git ls-files --others --exclude-standard >> "$RUNNER_TEMP/locks/changed.txt"
          while read -r f; do
            mkdir -p "$RUNNER_TEMP/locks/files/$(dirname "$f")"
            cp "$f" "$RUNNER_TEMP/locks/files/$f"
          done < "$RUNNER_TEMP/locks/changed.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: locks
          path: ${{ runner.temp }}/locks
          retention-days: 1

  commit:
    needs: regenerate
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: locks
          path: ${{ runner.temp }}/locks
      # Only lock files and the verification metadata are taken; anything else the build touched is refused.
      - name: Apply the lock files
        id: apply
        run: |
          allowed='^(gradle\.lockfile|settings-gradle\.lockfile|.*/gradle\.lockfile|gradle/verification-metadata\.xml|apps/web/package-lock\.json)$'
          while read -r f; do
            [ -z "$f" ] && continue
            if ! [[ "$f" =~ $allowed ]]; then
              echo "::error::The refresh changed $f, which is not a lock file"
              exit 1
            fi
            mkdir -p "$(dirname "$f")"
            cp "$RUNNER_TEMP/locks/files/$f" "$f"
          done < "$RUNNER_TEMP/locks/changed.txt"
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Commit and start CI
        if: steps.apply.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh lock files and verification metadata"
          git push origin "HEAD:${{ github.head_ref }}"
          gh workflow run ci.yml --ref "${{ github.head_ref }}"
