name: Security

# Weekly OWASP dependency check of the jar and the web lockfile against the NVD. Needs the repository secret
# NVD_API_KEY (free key from nvd.nist.gov); without it the job fails, so a check that cannot run is not mistaken
# for a pass. It fails on a CVSS score of 7 or more.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

# The token reads the repository only; jobs that publish or release widen it themselves.
permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 60
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      ETRM_DB_USER: etrm
      ETRM_DB_PASSWORD: etrm
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: etrm
          POSTGRES_PASSWORD: etrm
          POSTGRES_DB: etrm_codegen
        # A free host port: the runner may host other jobs and databases.
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U etrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Database on the service's port
        run: |
          port=${{ job.services.postgres.ports['5432'] }}
          {
            echo "DB_PORT=$port"
            echo "PGPORT=$port"
            echo "ETRM_CODEGEN_DB_URL=jdbc:postgresql://localhost:$port/etrm_codegen"
          } >> "$GITHUB_ENV"
      - name: NVD key present
        id: key
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            # A check that cannot run is a failed check, not a passed one (review finding S8).
            echo "::error::NVD_API_KEY is not set; add it as a repository secret to run the dependency check."
            exit 1
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.key.outputs.present == 'true'
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: steps.key.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        if: steps.key.outputs.present == 'true'
      - name: Build the jar
        if: steps.key.outputs.present == 'true'
        run: ./gradlew :apps:api:bootJar -Petrm.skipWeb --no-daemon
      - name: OWASP dependency check (fails on CVSS 9 or higher)
        if: steps.key.outputs.present == 'true'
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/src" -v "$HOME/.dependency-check:/usr/share/dependency-check/data" \
            owasp/dependency-check:12.1.0 \
            --project goo-ets-etrm --scan /src/apps/api/build/libs/api.jar --scan /src/apps/web/package-lock.json \
            --nvdApiKey "$NVD_API_KEY" --format HTML --format JSON --failOnCVSS 7 --out /src/reports
      - name: Upload report
        if: always() && steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-check
          path: reports/
          retention-days: 30
