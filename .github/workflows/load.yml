name: Load test

# Manual: k6 against the jar with the demo data on a CI runner (docs/operations/load-testing.md). A CI runner is a
# noisy, two-core machine, so the thresholds catch regressions of the order of magnitude, not small drifts.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: k6 profile (smoke, baseline, stress)
        default: baseline
        type: choice
        options: [smoke, baseline, stress]

# The token reads the repository only; jobs that publish or release widen it themselves.
permissions:
  contents: read

jobs:
  load:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: etrm
          POSTGRES_PASSWORD: etrm
          POSTGRES_DB: etrm_codegen
        # A free host port: the runner may host other jobs and databases.
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U etrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ETRM_DB_USER: etrm
      ETRM_DB_PASSWORD: etrm
    steps:
      - name: Database on the service's port
        run: |
          port=${{ job.services.postgres.ports['5432'] }}
          {
            echo "DB_PORT=$port"
            echo "PGPORT=$port"
            echo "ETRM_CODEGEN_DB_URL=jdbc:postgresql://localhost:$port/etrm_codegen"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Boot jar
        run: ./gradlew :apps:api:bootJar
      - name: Start the application with the demo data
        run: |
          PGPASSWORD=etrm psql -h localhost -U etrm -d etrm_codegen -c "CREATE DATABASE etrm_load"
          ETRM_DB_URL=jdbc:postgresql://localhost:${{ env.DB_PORT }}/etrm_load nohup "$JAVA_HOME_25_X64/bin/java" -jar apps/api/build/libs/api.jar \
            --spring.profiles.active=dev,demo --logging.level.com.pianonurmi.etrm=INFO --logging.level.org.jooq=INFO > app.log 2>&1 &
          for _ in $(seq 1 90); do curl -fs http://localhost:8080/actuator/health/readiness && break; sleep 2; done
          curl -fs http://localhost:8080/actuator/health/readiness
      - uses: grafana/setup-k6-action@43b9fc21641a76002687994433dd586f56e791b1 # v1.2.2
        with:
          k6-version: 1.3.0
      - name: k6
        run: k6 run -e BASE_URL=http://localhost:8080 -e PROFILE=${{ inputs.profile }} --summary-export=k6-summary.json ops/load/etrm.js
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-${{ inputs.profile }}
          path: |
            k6-summary.json
            app.log
          retention-days: 30
