name: Documentation screenshots

# Takes the pictures of the manual and the README (docs/images) from the showcase, as a visitor sees it, and uploads
# them as an artifact. Committing them is a manual step after reviewing them by eye (docs/ui/testing.md).
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

jobs:
  screenshots:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: etrm
          POSTGRES_PASSWORD: etrm
          POSTGRES_DB: etrm_codegen
        # A free host port: the runner may host other jobs and databases.
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U etrm"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ETRM_DB_USER: etrm
      ETRM_DB_PASSWORD: etrm
    steps:
      - name: Database on the service's port
        run: |
          port=${{ job.services.postgres.ports['5432'] }}
          {
            echo "DB_PORT=$port"
            echo "PGPORT=$port"
            echo "ETRM_CODEGEN_DB_URL=jdbc:postgresql://localhost:$port/etrm_codegen"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Create the database
        run: PGPASSWORD=etrm psql -h localhost -U etrm -d etrm_codegen -c "CREATE DATABASE etrm_docs;"
      - name: Boot jar
        run: ./gradlew :apps:api:bootJar --no-daemon
      - name: Install Playwright browser
        working-directory: apps/web
        run: npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps' || '' }} chromium
      - name: Take the screenshots
        working-directory: apps/web
        env:
          CI: "true"
          E2E_DOCS_DB_URL: jdbc:postgresql://localhost:${{ env.DB_PORT }}/etrm_docs
          ETRM_JAVA: ${{ env.JAVA_HOME_25_X64 }}/bin/java
        run: npm run docs:screenshots
      - name: Check the image sizes
        working-directory: apps/web
        run: npm run check:help
      - name: Upload the screenshots
        uses: actions/upload-artifact@v7
        with:
          name: docs-images
          path: docs/images/*.png
          retention-days: 30
