name: ZAP baseline

# Passive scan of the running application as a production profile serves it: the UI shell, public endpoints and the
# headers of protected ones (docs/security/penetration-test.md). Rules and reviewed findings: .zap/rules.tsv.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

# The token reads the repository only; jobs that publish or release widen it themselves.
permissions:
  contents: read

jobs:
  zap:
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"ubuntu-latest"') }}
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: etrm
          POSTGRES_PASSWORD: etrm
          POSTGRES_DB: etrm_codegen
        # A free host port: the runner may host other jobs and databases.
        ports: ["5432"]
        options: >-
          --health-cmd "pg_isready -U etrm -d etrm_codegen"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ETRM_DB_USER: etrm
      ETRM_DB_PASSWORD: etrm
    steps:
      - name: Database on the service's port
        run: |
          port=${{ job.services.postgres.ports['5432'] }}
          {
            echo "DB_PORT=$port"
            echo "PGPORT=$port"
            echo "ETRM_CODEGEN_DB_URL=jdbc:postgresql://localhost:$port/etrm_codegen"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: |
            25
            21
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true
      - name: Boot jar
        run: ./gradlew :apps:api:bootJar
      - name: Start the application (secured chain, no identity provider reachable)
        run: |
          PGPASSWORD=etrm psql -h localhost -U etrm -d etrm_codegen -c "CREATE DATABASE etrm_zap"
          ETRM_DB_URL=jdbc:postgresql://localhost:${{ env.DB_PORT }}/etrm_zap ETRM_OIDC_ISSUER=http://localhost:8081/realms/etrm \
            nohup "$JAVA_HOME_25_X64/bin/java" -jar apps/api/build/libs/api.jar > app.log 2>&1 &
          for _ in $(seq 1 90); do curl -fs http://localhost:8080/actuator/health/readiness && break; sleep 2; done
          curl -fs http://localhost:8080/actuator/health/readiness
      - name: ZAP baseline
        run: |
          mkdir -p zap && cp .zap/rules.tsv zap/ && chmod -R a+rwx zap
          # -I: warnings are reported, only rules set to FAIL in rules.tsv fail the job.
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" zaproxy/zap-stable:2.16.1 \
            zap-baseline.py -t http://localhost:8080/ -c rules.tsv -r zap-report.html -J zap-report.json -m 3 -I
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: zap
          path: |
            zap/zap-report.html
            zap/zap-report.json
            app.log
          retention-days: 30
